
---

-   defaults:
        link:
            relink: true

-   clean:
        -   '~'

-   create:
        -   ~/.claude

-   link:
        ~/.claude/settings.json: claude/settings.json
        ~/.gitconfig: gitconfig
        ~/.zshrc: zshrc
        ~/.bash_profile: bash_profile
        ~/.bashrc: bashrc
        ~/.inputrc: inputrc
        ~/.p10k.zsh: p10k.zsh
        ~/.tmux.conf: tmux.conf
        ~/.tmuxp: tmuxp
        ~/.bashrc.d/1.argrelay.shell_env.bash: bashrc.d/1.argrelay.shell_env.bash
        ~/.bashrc.d/9.sdkman.init.bash: bashrc.d/9.sdkman.init.bash

# EOF
